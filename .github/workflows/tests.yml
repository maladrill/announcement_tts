name: Module checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, pdo_mysql, curl, simplexml
          coverage: none
      - name: Install audio converter and test database
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg mariadb-server
          sudo systemctl start mariadb
          sudo mariadb --batch <<'SQL'
          CREATE DATABASE announcementtts_install_test CHARACTER SET utf8mb4;
          CREATE USER 'runner'@'localhost' IDENTIFIED VIA unix_socket;
          GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, ALTER, DROP ON announcementtts_install_test.* TO 'runner'@'localhost';
          SQL
      - name: Check PHP and JavaScript syntax
        run: |
          find . -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check assets/js/announcementtts.js
      - name: Run offline regression tests
        run: |
          php tests/run.php
          node tests/list-actions.js
      - name: Test installation and FreePBX registration against MariaDB
        env:
          ANNOUNCEMENTTTS_INSTALL_DSN: mysql:unix_socket=/run/mysqld/mysqld.sock;dbname=announcementtts_install_test;charset=utf8mb4
          ANNOUNCEMENTTTS_INSTALL_DB_USER: runner
        run: php tests/install.php
